name: Update PPDB logo thumbnails

on:
  workflow_dispatch:
    inputs:
      verify_all:
        description: Download and verify the complete R2 archive
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ppdb-media-and-pages
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test R2 processing
        run: node --test tests/r2-media.test.mjs
      - name: Update previews in R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERIFY_ALL: ${{ inputs.verify_all }}
        run: |
          if [ "$VERIFY_ALL" = "true" ]; then
            npm run media:process -- --verify-all
          else
            npm run media:process
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: r2-media-processing
          path: outputs/r2-media-processing.json
          retention-days: 30

name: Sync PPDB media to R2

on:
  push:
    branches: [main]
    paths:
      - 'public/media/**'
      - 'scripts/generate-logo-thumbnails.mjs'
      - 'scripts/sync-media-r2.mjs'
      - 'lib/logo-thumbnail-path.mjs'
      - 'tests/r2-media.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/r2-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-media
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check R2 settings
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module -e '
            const names = ["R2_ACCOUNT_ID", "R2_BUCKET", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY"];
            const missing = names.filter(name => !process.env[name]?.trim());
            if (missing.length) throw new Error(`Missing repository secrets: ${missing.join(", ")}`);
            console.log("All four R2 repository secrets are configured; values are not displayed.");
          '
      - run: npm ci
      - name: Test R2 synchronization
        run: node --test tests/r2-media.test.mjs
      - uses: actions/cache@v4
        with:
          path: public/media/logo-thumbnails
          key: thumbnails-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/generate-logo-thumbnails.mjs', 'lib/logo-thumbnail-path.mjs') }}-${{ hashFiles('public/media/**') }}
          restore-keys: |
            thumbnails-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/generate-logo-thumbnails.mjs', 'lib/logo-thumbnail-path.mjs') }}-
      - name: Generate all media thumbnails
        run: node scripts/generate-logo-thumbnails.mjs
      - name: Upload and verify media
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/sync-media-r2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: r2-media-verification
          path: outputs/r2-media-sync.json
          retention-days: 30

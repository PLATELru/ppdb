name: Deploy PPDB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/media/logo-thumbnails
          key: thumbnails-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/generate-logo-thumbnails.mjs', 'lib/logo-thumbnail-path.mjs') }}-${{ hashFiles('public/media/**') }}
          restore-keys: |
            thumbnails-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/generate-logo-thumbnails.mjs', 'lib/logo-thumbnail-path.mjs') }}-
      - name: Check image references and synchronization
        run: node --test tests/logo-reference.test.mjs tests/r2-media.test.mjs
      - name: Generate thumbnails before R2 synchronization
        run: node scripts/generate-logo-thumbnails.mjs
      - name: Synchronize and verify changed media before publishing
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/sync-media-r2.mjs
      - run: npm run build:github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

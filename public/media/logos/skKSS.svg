 <title id="title">Historical KSS star with hammer and sickle</title>
 <desc id="desc">Refined vector reconstruction of the historical KSS membership-document emblem. Lettering removed. The five-pointed star has equal points and straight edges. The original hammer-and-sickle silhouette is smoothed, preserving its orientation and proportions. Red #AB1927, white interior symbol, transparent background.</desc>
